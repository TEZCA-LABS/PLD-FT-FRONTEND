version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://host.docker.internal:8001/api/v1}
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://host.docker.internal:8001/api/v1}
    restart: unless-stopped
